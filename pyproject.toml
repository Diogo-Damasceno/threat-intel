[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-intel"
version = "0.1.0"
description = "Threat Intelligence Platform: armazenamento, busca e API REST de IOCs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Damasceno", email = "mitszukyo@gmail.com" }]
keywords = ["security", "threat-intel", "ioc", "cti", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tip = "tip.cli:main"

[tool.setuptools.packages.find]
include = ["tip*"]
